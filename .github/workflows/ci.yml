name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test native PostgreSQL and the report
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16
          PATH="/usr/lib/postgresql/16/bin:$PATH" node --test
      - name: Rehearse both access policies in Docker
        run: |
          output="$RUNNER_TEMP/restorelab-ci"
          RESTORELAB_STATE="$output/history" node restorelab.mjs demo "$output" --docker
